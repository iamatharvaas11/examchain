# =============================================================================
# EXAMCHAIN — Docker Compose (Phase 1: Foundation)
# =============================================================================
# Phase 1 containers: backend, frontend, postgres
# Additional services will be added in subsequent phases.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — Operational Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: examchain-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-examchain}
      POSTGRES_USER: ${POSTGRES_USER:-examchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examchain} -d ${POSTGRES_DB:-examchain}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend — Spring Boot API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examchain-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-examchain}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-examchain}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_dev}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: "8080"
      EXAMCHAIN_CORS_ORIGINS: "http://localhost:5173,http://localhost:80,http://frontend:80"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend — React SPA (Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: examchain-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

