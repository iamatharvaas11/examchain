spring:
  application:
    name: examchain
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/examchain}
    username: ${SPRING_DATASOURCE_USERNAME:examchain}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/examchain}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/examchain/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8080}

examchain:
  version: 0.1.0
  cors:
    allowed-origins: ${EXAMCHAIN_CORS_ORIGINS:http://localhost:5173,http://localhost:80}

management:
  endpoints:
    web:
      exposure:
        include: health,info
        include: health,info,prometheus,metrics


